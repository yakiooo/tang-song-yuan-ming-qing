<script>
const $=(s,r)=> (r || document).querySelector(s);

const EMP={},PER={},EMPNAME={};

'皇帝':'#8a1c14','文臣':'#3f5f7a','武将':'#7a5a20','宦官':'#5b4a6b',
'外族':'#2f6b5b','宗室':'#6b6b2f','起义军':'#a05a1e','群雄':'#6b4a2f',

function srcHTML(s,net){

}
function fmt(n){return n >=10000 ? (n / 10000).toFixed(1) +' 万':String(n);}
let LINKRE=null,LINKMAP=null;
const RIVAL_CAT={'群雄':1,'起义军':1,'外族':1,'海盗':1,'宗室':1};
const RIVAL_NAME={};
function buildLinks(){
const map={};
const add=(key,target,eras)=>{
if (!key || key.length < 2) return;
if (!map[key]) map[key]=[];
if (!map[key].some(x=> x.t===target)) map[key].push({t:target,eras:eras || []});
};
D.people.forEach(p=>{
const base=p.name.split('（')[0];
const eras=p.reigns || [];
add(base,'pid:' + p.id,eras);
((D.linkAlias ||{})[base] || []).filter(a=> a.length >=2).forEach(a=> add(a,'pid:' + p.id,eras));
});
D.emperors.forEach(e=>{
const eras=e.era.split(' / ');
add(e.name,'emp:' + e.id,eras);
((D.empAlias ||{})[e.name] || []).filter(a=> a.length >=2).forEach(a=> add(a,'emp:' + e.id,eras));
});
Object.keys(D.minor).forEach(n=>{
const ids=D.minorEmp[n] || [];
const eras=ids.map(id=> (D.emperors.find(x=> x.id===id) ||{}).era ||'')
.join(' / ').split(' / ').filter(Boolean);
add(n,'minor:' + n,eras);
});
LINKMAP=map;
const keys=Object.keys(map).sort((a,b)=> b.length - a.length);
LINKRE=new RegExp('(' + keys.map(k=> k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') +')','g');
}
function linkPick(name,ctx){
const cands=LINKMAP[name];
if (!cands) return null;
const hit=cands.filter(c=> c.eras.some(e=> (ctx || []).some(x=> x && (x.indexOf(e) >=0 || e.indexOf(x) >=0))));
if (hit.length) return hit[0];
return cands.length===1 ? cands[0]:null;
}
function linkify(text,ctx,self){
const s=esc(text);
if (!LINKRE || !s) return s;
return s.replace(LINKRE,m=>{
const pick=linkPick(m,ctx);
if (!pick || pick.t===self) return m;
const isMin=pick.t.indexOf('minor:')===0;
const attr=isMin ?'data-min="' + esc(pick.t.slice(6)) +'"':'data-pl="' + esc(pick.t) +'"';
return'<span class="plink' + (isMin ?' minor':'') +'" ' + attr +'>' + m +'</span>';
});
}
function bindLinks(root){
root.querySelectorAll('[data-pl]').forEach(el=> el.addEventListener('click',ev=>{

root.querySelectorAll('[data-min]').forEach(el=> el.addEventListener('click',ev=>{

const GEN_W=1240,ROW_H=136,SUB_GAP=112,GEN_TOP=26,GW=158;
const genCanvas=$('#gen-canvas');
const gEls={};
const genRows=[];
let GEN_H=0;
let zoomMode='fit';
function gcardInner(c){

function renderGen(){

'<div class="gf-cards">' + g.cards.map(c=>

genCanvas.style.width=GEN_W +'px';

D.gens.forEach((g,gi)=>{
g.cards.forEach(c=>{c._sub=1;});
const nsub=g.cards.length > 6 ? 2:1;

g.cards.forEach((c,i)=>{ if (typeof c.xx !=='number') c.xx=L +(R -L) *i / Math.max(1,g.cards.length -1);});
}
if (nsub > 1){
const p0=parts[0].length;
const xs0=parts[0].map((c,i)=> L + (R - L) * i / Math.max(1,p0 - 1));
const xs1=xs0.slice(0,-1).map((x,i)=> (x + xs0[i + 1]) / 2);
const n1=parts[1].length;
const xs1all=n1 <= xs1.length ? xs1 : Array.from({length:n1},(_,i)=> L + (R - L) * i / Math.max(1,n1 - 1));
parts[0].forEach((c,i)=>{c._x=xs0[i];});
parts[1].forEach((c,i)=>{c._x=xs1all[i];});
}
const rowH=nsub===1 ? ROW_H:ROW_H + SUB_GAP;
genRows.push({top:accTop,h:rowH,nsub,parts});
const row=document.createElement('div');
row.className='gen-row';
row.style.top=accTop +'px';
row.style.height=rowH +'px';
row.innerHTML='<div class="gen-rule" style="top:' + (rowH - 24) +'px"></div>' +
'<div class="gen-label"><span class="n">' + g.n +'</span><span class="t">' +
'<span class="g1">第' + g.n +'世 · ' + esc(g.eras) +'</span>' +
'<span class="g2">父辈 · ' + esc(g.father ||'—') + (nsub > 1 ?' · ' + g.cards.length +' 人（两排）':'') +'</span></span></div>';
genCanvas.appendChild(row);
let seq=0;
parts.forEach((part,si)=>{
part.forEach(c=>{
const el=document.createElement('div');
el.className='gcard' + (c.emp ?' emp':'');
const pct=nsub > 1 ? c._x:c.xx;
const cx=Math.max(pct,L) / 100 * GEN_W;
const cy=accTop + GEN_TOP + 6 + si * SUB_GAP;
el.style.left=(cx - GW / 2) +'px';
el.style.top=(GEN_TOP + 6 + si * SUB_GAP) +'px';
el.style.animationDelay=(gi * 26 + seq * 18) +'ms';
el.innerHTML=gcardInner(c);
bindCard(el,c);
row.appendChild(el);
gEls[c.k]={x:cx,y:cy,h:92,si,gi,rowTop:accTop,rowH:rowH,parts:parts.length};
seq++;
});
});
accTop +=rowH;
});
genCanvas.style.height=(accTop + 46) +'px';
GEN_H=accTop + 46;
drawGenEdges();
applyZoom();
$('#gen-view').scrollLeft=0;
}
function findCard(k){
for (const g of D.gens){const c=g.cards.find(x=> x.k===k);if (c) return c;}
return null;
}
function applyZoom(){
const wrap=$('#gen-view');

const k=zoomMode==='fit' ? Math.min(1,Math.max(.8,(wrap.clientWidth - 4) / GEN_W)):1;

function drawGenEdges(){
const svg=$('#gen-lines');
if (!svg || window.innerWidth < 760 || !Array.isArray(D.genEdges)) return;
svg.setAttribute('viewBox','0 0 ' + GEN_W +' ' + (GEN_H || genCanvas.offsetHeight));
const defs=
'<defs><marker id="ga" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">' +
'<path d="M0,0 L10,5 L0,10 z" fill="#a1261f"/></marker></defs>';
let body='';
const midY=(a,b)=> ((a.y + a.h) + b.y) / 2;
const busKey={};
D.genEdges.forEach(e=>{
const B=gEls[e[1]];
if (B && B.si > 0) busKey[e[0] +'>' + B.gi]=1;
});
const busParent={};
Object.keys(busKey).forEach(key=>{
const pk=key.split('>')[0],gi=+key.split('>')[1];
const A=gEls[pk];
if (!A || busParent[pk]) return;
const kids=D.genEdges.filter(e=> e[0]===pk && gEls[e[1]] && gEls[e[1]].gi===gi)
.map(e=> gEls[e[1]]).filter(k=> k.parts > 1);
if (!kids.length) return;
busParent[pk]=1;
const busY=Math.min.apply(null,kids.map(k=> k.rowTop + GEN_TOP + 6)) - 10;
const xs=kids.map(k=> k.x);
body +='<line x1="' + A.x +'" y1="' + (A.y + A.h) +'" x2="' + A.x +'" y2="' + busY +
'" stroke="#a1261f" stroke-width="1.6" opacity=".55"/>';
body +='<line x1="' + Math.min.apply(null,xs) +'" y1="' + busY +'" x2="' + Math.max.apply(null,xs) +
'" y2="' + busY +'" stroke="#a1261f" stroke-width="1.6" opacity=".55"/>';
kids.forEach(k=>{
body +='<line x1="' + k.x +'" y1="' + busY +'" x2="' + k.x +'" y2="' + k.y +
'" stroke="#a1261f" stroke-width="1.6" opacity=".55" marker-end="url(#ga)"/>';
});
});
D.genEdges.forEach(e=>{
const A=gEls[e[0]],B=gEls[e[1]];
if (!A || !B) return;
if (busKey[e[0] +'>' + B.gi]) return;
const type=e[2],label=e[3] ||'';
let ax=A.x,ay=A.y + A.h,bx=B.x,by=B.y;
if (type==='duel'){
const y1=A.y + A.h / 2,y2=B.y + B.h / 2;
body +='<line x1="' + (ax + 82) +'" y1="' + (y1 - 5) +'" x2="' + (bx - 82) +'" y2="' + (y2 - 5) +
'" stroke="#a1261f" stroke-width="1.8" marker-end="url(#ga)"/>';
body +='<line x1="' + (bx - 82) +'" y1="' + (y2 + 5) +'" x2="' + (ax + 82) +'" y2="' + (y1 + 5) +
'" stroke="#a1261f" stroke-width="1.8" marker-end="url(#ga)"/>';
body +=gtext((ax + bx) / 2,y1 - 16,label,'#8a1c14');
return;
}
if (type==='jingnan'){
const up=B.y < A.y;
const gapY=up ? (A.y - 14):(B.y + B.h + 14);
const y1=up ? A.y:(A.y + A.h);
const y2=up ? (B.y + B.h):B.y;
body +='<path d="M' + (ax + 50) +',' + y1 +' V' + gapY +' H' + (bx - 50) +' V' + y2 +
'" fill="none" stroke="#a1261f" stroke-width="2.2" stroke-dasharray="8,5" marker-end="url(#ga)" opacity=".85"/>';
body +=gtext((ax + bx) / 2,gapY + (up ? 16:-8),label,'#8a1c14');
return;
}
if (type==='lineage'){
const chan=GEN_W - 26;
body +='<path d="M' + (ax + 58) +',' + (A.y + A.h) +' V' + (A.y + A.h + 14) +' H' + chan +
' V' + (B.y - 14) +' H' + (B.x + 58) +' V' + B.y +
'" fill="none" stroke="#8a7c66" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#ga)" opacity=".8"/>';
body +=gtext((chan + ax) / 2,A.y + A.h + 6,label,'#77685a');
return;
}
if (Math.abs(A.y - B.y) < 4){
const y=A.y + A.h / 2;
const lx=Math.min(ax,bx),rx=Math.max(ax,bx);
const bro=type==='brother';
const midCol=Object.keys(gEls).some(k=>{
const G=gEls[k];
if (G===A || G===B) return false;
if (Math.abs(G.y - A.y) > 4) return false;
return G.x > lx + 82 && G.x < rx - 82;
});
if (midCol){
const yTop=A.y - 12;
body +='<path d="M' + (lx + 82) +',' + A.y +' V' + yTop +' H' + (rx - 82) +' V' + B.y +
'" fill="none" stroke="' + (bro ?'#b08b3e':'#a1261f') +'" stroke-width="1.8"' +
(bro ?' stroke-dasharray="7,5"':'') +' marker-end="url(#ga)" opacity=".85"/>';
if (label) body +=gtext((lx + rx) / 2,yTop - 5,label,bro ?'#7c5a1c':'#8a1c14');
return;
}
body +='<line x1="' + (lx + 82) +'" y1="' + y +'" x2="' + (rx - 82) +'" y2="' + y +
'" stroke="' + (bro ?'#b08b3e':'#a1261f') +'" stroke-width="1.8"' +
(bro ?' stroke-dasharray="7,5"':'') +' marker-end="url(#ga)" opacity=".85"/>';
if (label) body +=gtext((lx + rx) / 2,y - 9,label,bro ?'#7c5a1c':'#8a1c14');
return;
}
let stroke='#a1261f',w=1.6,dash='',op=.55;
if (type==='adopt' || type==='brother'){stroke='#b08b3e';w=2;dash=' stroke-dasharray="7,5"';op=.95;}
let chanY=midY(A,B);
if (A.parts > 1 && A.si===0 && B.y > A.y && A.rowH){
const below=A.rowTop + A.rowH + 8;
if (below < B.y - 6) chanY=below;
}
if (Math.abs(ax - bx) < 6){
body +='<line x1="' + ax +'" y1="' + ay +'" x2="' + bx +'" y2="' + by +'" stroke="' + stroke +
'" stroke-width="' + w +'" opacity="' + op +'"' + dash +'/>';
}else{
body +='<path d="M' + ax +',' + ay +' V' + chanY +' H' + bx +' V' + by +'" fill="none" stroke="' + stroke +
'" stroke-width="' + w +'" opacity="' + op +'"' + dash +'/>';
}
if (label) body +=gtext((ax + bx) / 2,chanY - 5,label,type==='lineage' ?'#77685a':'#7c5a1c');
});
svg.innerHTML=defs + body;
}
function gtext(x,y,t,color){

function openRoyal(k){

const KEY_WORDS=['起兵','称帝','建国','玄武门','之变','政变','之战','大捷','登基','即位','禅位','让位',
'叛乱','之乱','改革','新政','盛世','中兴','灭亡','之死','兵变','决战','受降','陷落','光复',
'封禅','驾崩','马嵬驿','黄巢','甘露','藩镇','宦官','武周','神龙','开元','安史','两税','永贞','元和中兴'];
function quoteLen(en){return (en.quotes || []).reduce((s,q)=> s + String(q.text ||'').length,0);}
function chunkEven(arr,maxPer){
if (arr.length <=maxPer) return [arr];
const cnt=Math.ceil(arr.length / maxPer);
const out=[];
let i=0;
for (let k=cnt;k > 0;k--){
const size=Math.ceil((arr.length - i) / k);
out.push(arr.slice(i,i + size));
i +=size;
}
return out;
}
function chunkByYear(arr,maxPer){
const out=[];let cur=[];
arr.forEach(it=>{
if (cur.length && cur.length >= maxPer && cur[cur.length - 1].en.year !== it.en.year){out.push(cur);cur=[];}
cur.push(it);
});
if (cur.length) out.push(cur);
return out.length ? out:[arr];
}
function yearSpan(items){
const a=items[0].en.year,b=items[items.length - 1].en.year;
return a===b ? a:a +'–' + b;
}
function eraName(e){
return e.era.indexOf(' / ') >=0 ? e.era.replace(' / ',' · '):e.era +'朝';
}
function splitParts(n){
return n===2 ? ['前期','后期']:n===3 ? ['前期','中期','后期']:['第一段','第二段','第三段','第四段'];
}
function groupEmperorBands(e){
const groups=[];
e.entries.forEach((en,i)=>{
const key=en.stage ? '#S' + en.stage : (en.reign ||'本朝');
const g=groups[groups.length - 1];
if (g && g.key===key) g.items.push({en,i});
else groups.push({key,items:[{en,i}]});
});
const out=[];
groups.forEach(g=>{
if (g.items[0].en.stage){
out.push({name:g.items[0].en.stage,sub:(g.items[0].en.reign ? g.items[0].en.reign +'朝 · ':'') + yearSpan(g.items),items:g.items});
return;
}
const mono=g.items.every((x,i)=> i===0 || +x.en.year >= +g.items[i - 1].en.year);
const chunks=mono ? chunkByYear(g.items,4):chunkEven(g.items,4);
chunks.forEach((items,k)=> out.push({
name:(g.key==='本朝' ? eraName(e):g.key +'朝') + (chunks.length > 1 ?' · ' + splitParts(chunks.length)[k]:''),
sub:yearSpan(items),
items
}));
});
return out;
}
function groupPersonBands(m){
const groups=[];
m.entries.forEach((en,i)=>{
