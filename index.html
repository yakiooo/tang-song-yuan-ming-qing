const RIVAL_CAT={'群雄':1,'起义军':1,'外族':1,'海盗':1,'宗室':1};

};
D.people.forEach(p=>{
const base=p.name.split('（')[0];

add(base,'pid:' + p.id,eras);
((D.linkAlias ||{})[base] || []).filter(a=> a.length >=2).forEach(a=> add(a,'pid:' + p.id,eras));
});
D.emperors.forEach(e=>{
const eras=e.era.split(' / ');
add(e.name,'emp:' + e.id,eras);
((D.empAlias ||{})[e.name] || []).filter(a=> a.length >=2).forEach(a=> add(a,'emp:' + e.id,eras));
});
Object.keys(D.minor).forEach(n=>{

.join(' / ').split(' / ').filter(Boolean);
add(n,'minor:' + n,eras);
});

const keys=Object.keys(map).sort((a,b)=> b.length - a.length);

function linkPick(name,ctx){

}

const pick=linkPick(m,ctx);
if (!pick || pick.t===self) return m;
const isMin=pick.t.indexOf('minor:')===0;
const attr=isMin ?'data-min="' + esc(pick.t.slice(6)) +'"':'data-pl="' + esc(pick.t) +'"';

const KEY_WORDS=['起兵','称帝','建国','玄武门','之变','政变','之战','大捷','登基','即位','禅位','让位',
'叛乱','之乱','改革','新政','盛世','中兴','灭亡','之死','兵变','决战','受降','陷落','光复',
'封禅','驾崩','马嵬驿','黄巢','甘露','藩镇','宦官','武周','神龙','开元','安史','两税','永贞','元和中兴'];
function quoteLen(en){return (en.quotes || []).reduce((s,q)=> s + String(q.text ||'').length,0);}
function chunkEven(arr,maxPer){
if (arr.length <=maxPer) return [arr];
const cnt=Math.ceil(arr.length / maxPer);
const out=[];
let i=0;
for (let k=cnt;k > 0;k--){
const size=Math.ceil((arr.length - i) / k);
out.push(arr.slice(i,i + size));
i +=size;
}
return out;
}
function chunkByYear(arr,maxPer){
const out=[];let cur=[];
arr.forEach(it=>{
if (cur.length && cur.length >= maxPer && cur[cur.length - 1].en.year !== it.en.year){out.push(cur);cur=[];}
cur.push(it);
});
if (cur.length) out.push(cur);
return out.length ? out:[arr];
}
function yearSpan(items){
const a=items[0].en.year,b=items[items.length - 1].en.year;
return a===b ? a:a +'–' + b;
}
function eraName(e){
return e.era.indexOf(' / ') >=0 ? e.era.replace(' / ',' · '):e.era +'朝';
}
function splitParts(n){
return n===2 ? ['前期','后期']:n===3 ? ['前期','中期','后期']:['第一段','第二段','第三段','第四段'];
}
function groupEmperorBands(e){
const groups=[];
e.entries.forEach((en,i)=>{
const key=en.stage ? '#S' + en.stage : (en.reign ||'本朝');
const g=groups[groups.length - 1];
if (g && g.key===key) g.items.push({en,i});
else groups.push({key,items:[{en,i}]});
});
const out=[];
groups.forEach(g=>{
if (g.items[0].en.stage){
out.push({name:g.items[0].en.stage,sub:(g.items[0].en.reign ? g.items[0].en.reign +'朝 · ':'') + yearSpan(g.items),items:g.items});
return;
}
const mono=g.items.every((x,i)=> i===0 || +x.en.year >= +g.items[i - 1].en.year);
const chunks=mono ? chunkByYear(g.items,4):chunkEven(g.items,4);
chunks.forEach((items,k)=> out.push({
name:(g.key==='本朝' ? eraName(e):g.key +'朝') + (chunks.length > 1 ?' · ' + splitParts(chunks.length)[k]:''),
sub:yearSpan(items),
items
}));
});
return out;
}
function groupPersonBands(m){
const groups=[];
m.entries.forEach((en,i)=>{
const key=en.reign ||'生平';
const g=groups[groups.length - 1];
if (g && g.key===key) g.items.push({en,i});
else groups.push({key,items:[{en,i}]});
});
const out=[];
groups.forEach(g=>{
const chunks=chunkEven(g.items,4);
const role=(m.roles && m.roles[g.key]) ? String(m.roles[g.key]):'';
chunks.forEach((items,k)=> out.push({
name:(g.key==='生平' ?'生平':g.key +'朝') + (chunks.length > 1 ?' · ' + splitParts(chunks.length)[k]:''),
sub:role && k===0 ? (role.length > 26 ? role.slice(0,26) +'…':role):yearSpan(items),
reign:groupReign(items),
items
}));
});
return out;
}
function groupReign(items){return items[0].en.reign ||'';}
function emperorKeys(e){
const hit=[];
e.entries.forEach((en,i)=>{
if (hit.length < 3 && KEY_WORDS.some(w=> en.title.indexOf(w) >=0)) hit.push(i);
});
if (!hit.length){
let best=0;
e.entries.forEach((en,i)=>{if (quoteLen(en) > quoteLen(e.entries[best])) best=i;});
hit.push(best);
}
return hit;
}
function personKeys(m){

const idx=m.entries.map((en,i)=> ({i,l:quoteLen(en)})).sort((a,b)=> b.l - a.l);
const out=[idx[0].i];
if (idx.length > 1 && idx[1].l >=idx[0].l * .62) out.push(idx[1].i);
return out;
}

warnedPkg[srcFail]=true;

showUncollected(k,srcFail || err.message);
}

let tlSelDyn=null;                 // 当前选中的朝代 key
const tlTrack=$('#tl-track'), tlCursor=$('#tl-cursor'), tlTip=$('#tl-tip');
const tlTipY=$('#tl-tip-y'), tlTipD=$('#tl-tip-d');
let tlRaf=null, tlLastX=0, tlLastYear=0, tlHoverTimer=null, tlLastPick=null;

// 打开时间轴视图
function openTimeline(){
  $$('#dynbar .dyn').forEach(b=> b.classList.remove('active'));
  $('#btn-timeline').classList.add('active');
  showStage('stage-timeline');
  // 进入时重置为总览
  tlSelDyn=null;
  $('#tl-empty').hidden=false;
  $('#tl-dyn-view').hidden=true;
  $('#tl-event-view').hidden=true;
  $('#tl-subbar').hidden=true;
  $('#tl-sub').textContent='滑动底部时间轴查看年代；点击朝代节点，展开该朝的细分事件';
  setTimeout(()=>{buildTicks();},30);
}

// 构建一级刻度与朝代节点
function buildTicks(){
  const box=$('#tl-ticks'); if(!box) return;
  box.innerHTML='';
  // 百年刻度（每 200 年标注数字）
  for(let y=600;y<=2000;y+=100){
    if(y<TL_MIN||y>TL_MAX) continue;
    const t=document.createElement('div');
    const major=(y%200===0);
    t.className='tl-tick'+(major?' major':''); t.style.left=tlPct(y)+'%'; box.appendChild(t);
    if(major && y>618 && y<1912){
      const lb=document.createElement('div');
      lb.className='tl-tick-label'; lb.style.left=tlPct(y)+'%'; lb.textContent=y;
      box.appendChild(lb);
    }
  }
  // 朝代节点
  TL_DYN.forEach(d=>{
    const node=document.createElement('div');
    node.className='tl-node'; node.style.left=tlPct(d.s)+'%';
    node.style.setProperty('--nc',d.c); node.textContent=d.n;
    node.title=d.n+' '+d.s+'–'+d.e;
    node.addEventListener('mouseenter',ev=>{ev.stopPropagation();showTip(d.s,d.n+' '+d.s+'–'+d.e);});
    node.addEventListener('mouseleave',()=>hideTip());
    node.addEventListener('click',ev=>{ev.stopPropagation();selectDynasty(d.k);});
    box.appendChild(node);
    const lab=document.createElement('div');
    lab.className='tl-node-label'; lab.dataset.k=d.k; lab.style.left=tlPct((d.s+d.e)/2)+'%'; lab.textContent=d.n;
    box.appendChild(lab);
  });
  // 朝代色带：按各朝区间铺满轴线
  const cb=$('#tl-axis-color'); cb.innerHTML='';
  TL_DYN.forEach(d=>{
    const b=document.createElement('div');
    b.className='tl-band'; b.dataset.k=d.k;
    b.style.left=tlPct(d.s)+'%';
    b.style.width=(tlPct(Math.min(d.e,TL_MAX))-tlPct(d.s))+'%';
    b.style.background=d.c;
    cb.appendChild(b);
  });
}

function showTip(year,label){
  tlTipY.textContent=year+' 年'; tlTipD.textContent=label; tlTip.classList.add('show');
}
function hideTip(){tlTip.classList.remove('show');tlCursor.classList.remove('show');}

// 一级轨道：rAF 节流的 Tooltip 跟随
if(tlTrack){
  tlTrack.addEventListener('mousemove',ev=>{
    const r=tlTrack.getBoundingClientRect();
    tlLastX=ev.clientX; tlLastYear=tlYearAt(ev.clientX-r.left,r.width);
    const dyn=yearDynasty(tlLastYear);
    if(tlRaf===null) tlRaf=requestAnimationFrame(()=>{
      tlRaf=null;
      const half=tlTip.offsetWidth/2;
      const x=tlClamp(tlLastX,half+8,window.innerWidth-half-8);
      tlTip.style.transform='translateX('+(x-half)+'px)';
      const rr=tlTrack.getBoundingClientRect();
      tlCursor.style.transform='translateX('+tlClamp(tlLastX-rr.left,0,rr.width)+'px)';
      tlTipY.textContent=tlLastYear+' 年';
      tlTipD.textContent=dyn?dyn.n+' · '+dyn.s+'–'+dyn.e:'—';
    });
    tlTip.classList.add('show'); tlCursor.classList.add('show');
    // 悬停 0.5s 选中所在朝代（下钻）
    if(!tlTopic && tlLastPick!==(dyn&&dyn.k)){
      clearTimeout(tlHoverTimer);
      tlHoverTimer=setTimeout(()=>{if(dyn){tlLastPick=dyn.k;selectDynasty(dyn.k);}},500);
    }
  });
  tlTrack.addEventListener('mouseleave',()=>{
    clearTimeout(tlHoverTimer);
    if(tlRaf!==null){cancelAnimationFrame(tlRaf);tlRaf=null;}
    hideTip();
  });
}
function yearDynasty(y){
  return TL_DYN.find(d=> (y>=d.s&&y<=d.e)) ||
         (y>=618&&y<960?TL_DYN[0]:null) || null; // 618–960 之间按唐处理
}

// 选中朝代 → 中部列出大量事件 + 展开二级轨道
function selectDynasty(k){
  const d=TL_DYN.find(x=>x.k===k); if(!d) return;
  tlSelDyn=k; tlLastPick=k;
  $('#tl-empty').hidden=true; $('#tl-event-view').hidden=true;
  const dv=$('#tl-dyn-view'); dv.hidden=false;
  const evs=TL_EVENTS[k]||[];
  // 摘要：取经过的前 46 字，模拟本纪卡片的 .es 摘要行
  const brief=t=> t.length>46 ? t.slice(0,46)+'…' : t;
  dv.innerHTML=
    '<div class="tl-dyn-hd"><span class="seal" style="background:'+d.c+'">'+d.n+'</span>'+
    '<span class="nm">'+d.n+'朝 · 大事记</span>'+
    '<span class="yr">公元 '+d.s+' — '+d.e+' 年</span>'+
    '<span class="ct">共 '+evs.length+' 条 · 点击卡片或菱形节点下钻</span></div>'+
    '<ul class="tl-ev-list">'+evs.map((e,i)=>
      '<li class="ecard" data-i="'+i+'" style="animation-delay:'+(i*40)+'ms">'+
        '<div class="ey"><span class="y">'+e.y+'</span><span class="rt">'+d.n+'</span></div>'+
        '<h3>'+e.t+'</h3>'+
        '<p class="es">'+brief(e.d)+'</p>'+
        '<div class="more">查看经过 ›</div>'+
      '</li>'
    ).join('')+'</ul>';
  dv.querySelectorAll('.ecard').forEach(li=> li.addEventListener('click',()=>selectEvent(k,+li.dataset.i)));
  // 联动高亮：一级节点 + 标签 + 色带
  document.querySelectorAll('#tl-ticks .tl-node,#tl-ticks .tl-node-label,#tl-axis-color .tl-band').forEach(el=>{
    el.classList.toggle('hot', el.dataset.k===k);
  });
  // 二级轨道
  const sb=$('#tl-subbar'); sb.hidden=false;
  $('#tl-subbar-label').textContent=d.n+' · 细分事件（'+evs.length+'）';
  const st=$('#tl-subtrack'); st.innerHTML='';
  evs.forEach((e,i)=>{
    const n=document.createElement('div');
    n.className='tl-snode'; n.dataset.i=i;
    n.style.left=(((e.y-d.s)/(d.e-d.s))*100)+'%';
    n.title=e.y+' '+e.t;
    n.addEventListener('click',()=>selectEvent(k,i));
    n.addEventListener('mouseenter',()=>showTip(e.y,e.t));
    n.addEventListener('mouseleave',()=>hideTip());
    st.appendChild(n);
  });
  $('#tl-sub').textContent='当前朝代：'+d.n+'（'+d.s+'–'+d.e+'）· 点事件卡片或菱形节点，查看更细微的经过';
}

// 下钻到单条事件 → 显示事件详情
function selectEvent(k,i){
  const e=(TL_EVENTS[k]||[])[i]; if(!e) return;
  const d=TL_DYN.find(x=>x.k===k);
  $('#tl-empty').hidden=true; $('#tl-dyn-view').hidden=true;
  const ev=$('#tl-event-view'); ev.hidden=false;
  ev.innerHTML=
    '<div class="tl-back">← 返回'+d.n+'朝全部事件</div>'+
    '<div class="ecard key">'+
      '<div class="ey"><span class="y">'+e.y+'</span><span class="rt">'+d.n+'朝</span></div>'+
      '<h3>'+e.t+'</h3>'+
      '<p class="es">'+e.d+'</p>'+
      '<div class="eq">'+e.d+'</div>'+
    '</div>';
  ev.querySelector('.tl-back').addEventListener('click',()=>selectDynasty(k));
  // 高亮对应二级节点与卡片
  document.querySelectorAll('#tl-subtrack .tl-snode').forEach(n=> n.classList.toggle('hot',+n.dataset.i===i));
  document.querySelectorAll('#tl-dyn-view .ecard').forEach(li=> li.classList.toggle('hot',+li.dataset.i===i));
}

 {k:'war',     n:'战争军事',  match:/之战|之乱|大捷|海战|起义|侵华|联军|兵变|靖难|土木堡|亲征|北伐|灭金|灭北汉|攻|伐|叛军|战败|全军覆没/},

 {k:'culture', n:'文化科技',  match:/大典|典籍|文学|诗歌|著作|思想|儒学|艺术|书画|建筑|工程|科技|航海|发明|公主|玄奘|传播|促进.*交流/},
 {k:'society', n:'民生经济',  match:/轻徭|薄赋|经济|农业|水利|人口|土地|商业|贸易|手工业|赋税|两税|荒|赈灾|民变|饥/}
];
let tlTopic=null; // 当前专题 key

// 把某事件归入专题：按标题+经过匹配关键词，可命中多个专题
function eventTopics(e){
  const text=e.t+e.d;
  return TL_TOPICS.filter(tp=>tp.match.test(text)).map(tp=>tp.k);
}
// 构建专题芯片
function buildTopics(){
  const box=$('#tl-topics'); if(!box) return;
  const cnt={}; TL_TOPICS.forEach(t=>cnt[t.k]=0);
  Object.values(TL_EVENTS).flat().forEach(e=> eventTopics(e).forEach(k=>{if(cnt[k]!==undefined)cnt[k]++;}));
  box.innerHTML='<div class="tl-topic-hint">专题年谱 · 跨朝代聚合同类事件（同一事件可归入多个专题）</div>'+
    TL_TOPICS.map(t=>'<div class="tl-topic" data-k="'+t.k+'">'+t.n+'<span class="n">'+cnt[t.k]+'</span></div>').join('');
  box.querySelectorAll('.tl-topic').forEach(el=> el.addEventListener('click',()=>selectTopic(el.dataset.k)));
}
// 选中专题 → 跨朝代聚合展示
function selectTopic(k){
  const tp=TL_TOPICS.find(x=>x.k===k); if(!tp) return;
  tlTopic=k;
  $('#tl-empty').hidden=true; $('#tl-event-view').hidden=true; $('#tl-subbar').hidden=true;
  $$('#dynbar .dyn,#btn-timeline').forEach(el=>el.classList.remove('active'));
  $('#btn-timeline').classList.add('active');
  document.querySelectorAll('#tl-topics .tl-topic').forEach(el=>el.classList.toggle('on',el.dataset.k===k));
  // 收集跨朝代事件：{k dyn key, dyn name, color, i index, e event}
  const rows=[];
  TL_DYN.forEach(d=>{
    (TL_EVENTS[d.k]||[]).forEach((e,i)=>{
      if(eventTopics(e).includes(k)) rows.push({dk:d.k,dn:d.n,c:d.c,i:i,e:e});
    });
  });
  rows.sort((a,b)=>a.e.y-b.e.y);
  const dv=$('#tl-dyn-view'); dv.hidden=false;
  const brief=t=> t.length>46 ? t.slice(0,46)+'…' : t;
  dv.innerHTML=
    '<div class="tl-dyn-hd"><span class="seal" style="background:#8a1c14">谱</span>'+
    '<span class="nm">专题 · '+tp.n+'</span>'+
    '<span class="yr">跨唐 · 宋 · 元 · 明 · 清</span>'+
    '<span class="ct">共 '+rows.length+' 条 · 按年份排序 · 点卡片看下钻</span></div>'+
    (rows.length?'<ul class="tl-ev-list">'+rows.map((r,idx)=>
      '<li class="ecard" data-dk="'+r.dk+'" data-i="'+r.i+'" style="animation-delay:'+(idx*32)+'ms">'+
        '<div class="ey"><span class="y">'+r.e.y+'</span><span class="rt" style="color:'+r.c+';border-color:'+r.c+'66">'+r.dn+'</span></div>'+
        '<h3>'+r.e.t+'</h3>'+
        '<p class="es">'+brief(r.e.d)+'</p>'+
        '<div class="more">查看经过 ›</div>'+
      '</li>'
    ).join('')+'</ul>':'<p style="color:#8a7c66;font-size:13px;padding:20px 0">该专题暂无匹配事件。</p>');
  dv.querySelectorAll('.ecard').forEach(li=> li.addEventListener('click',()=>{
    selectTopicEvent(li.dataset.dk,+li.dataset.i);
  }));
  // 清朝代节点/色带高亮
  document.querySelectorAll('#tl-ticks .tl-node,#tl-ticks .tl-node-label,#tl-axis-color .tl-band').forEach(el=>el.classList.remove('hot'));
  $('#tl-sub').textContent='专题年谱：'+tp.n+' · 跨五朝 '+rows.length+' 条事件，按年份从早到晚排列；再点顶部专题可返回';
}
// 专题事件下钻：复用详情视图，返回时回专题而非朝代
function selectTopicEvent(dk,i){
  const e=(TL_EVENTS[dk]||[])[i]; if(!e) return;
  const d=TL_DYN.find(x=>x.k===dk);
  $('#tl-empty').hidden=true; $('#tl-dyn-view').hidden=true; $('#tl-subbar').hidden=true;
  const ev=$('#tl-event-view'); ev.hidden=false;
  ev.innerHTML=
    '<div class="tl-back">← 返回专题年谱</div>'+
    '<div class="ecard key">'+
      '<div class="ey"><span class="y">'+e.y+'</span><span class="rt">'+d.n+'朝</span></div>'+
      '<h3>'+e.t+'</h3>'+
      '<p class="es">'+e.d+'</p>'+
      '<div class="eq">'+e.d+'</div>'+
    '</div>';
  ev.querySelector('.tl-back').addEventListener('click',()=>selectTopic(tlTopic||'found'));
}
// 打开时间轴/进入朝代视图时，退出专题状态
const _origOpenTimeline=openTimeline;
openTimeline=function(){tlTopic=null;buildTopics();_origOpenTimeline();};
const _origSelectDynasty=selectDynasty;
selectDynasty=function(k){tlTopic=null;document.querySelectorAll('#tl-topics .tl-topic').forEach(el=>el.classList.remove('on'));_origSelectDynasty(k);};
buildTopics();
</script>
